<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Panadería - Proyecto de arquitectura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0b0f14;
      font-family:Arial, Helvetica, sans-serif;
      overflow-x:hidden;
      color:white;
    }

    /* =========================
       HERO
    ==========================*/

    .hero{
      position:relative;
      width:100%;
      height:100vh;
      overflow:hidden;
    }

    .hero video{
      position:absolute;
      width:100%;
      height:100%;
      object-fit:cover;
      top:0;
      left:0;
      z-index:1;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(
        to top,
        rgba(0,0,0,0.75),
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.5)
      );
      z-index:2;
    }

    .hero-content{
      position:relative;
      z-index:3;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    .hero-content h1{
      font-size:5rem;
      letter-spacing:8px;
      font-weight:300;
      margin-bottom:20px;
    }

    .hero-content p{
      font-size:1.2rem;
      opacity:0.85;
      max-width:700px;
      line-height:1.6;
    }

    .scroll-btn{
      margin-top:40px;
      padding:14px 28px;
      border:1px solid rgba(255,255,255,0.3);
      background:rgba(255,255,255,0.08);
      color:white;
      cursor:pointer;
      border-radius:40px;
      backdrop-filter:blur(10px);
      transition:0.3s;
      font-size:0.95rem;
      letter-spacing:2px;
    }

    .scroll-btn:hover{
      background:white;
      color:black;
    }

    /* =========================
       VISOR DIA/NOCHE
    ==========================*/

    .viewer-section{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:80px 20px;
      background:#0f141b;
    }

    .viewer-title{
      font-size:2.5rem;
      margin-bottom:20px;
      font-weight:300;
      letter-spacing:4px;
      text-align:center;
    }

    .viewer-subtitle{
      opacity:0.7;
      margin-bottom:50px;
      text-align:center;
    }

    .viewer-container{
      position:relative;
      width:90%;
      max-width:1400px;
      aspect-ratio:16/9;
      overflow:hidden;
      border-radius:24px;
      box-shadow:
      0 20px 80px rgba(0,0,0,0.5);
    }

    .image-night,
    .image-day{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      user-select:none;
      pointer-events:none;
    }

    .image-night{
      z-index:1;
    }

    .image-day-wrapper{
      position:absolute;
      inset:0;
      width:50%;
      overflow:hidden;
      z-index:2;
    }

    .image-day{
      width:100%;
      height:100%;
    }

    .slider-line{
      position:absolute;
      top:0;
      bottom:0;
      left:50%;
      width:4px;
      background:white;
      z-index:5;
      transform:translateX(-50%);
      box-shadow:0 0 20px rgba(255,255,255,0.8);
    }

    .slider-button{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:60px;
      height:60px;
      border-radius:50%;
      background:white;
      z-index:6;
      display:flex;
      justify-content:center;
      align-items:center;
      color:black;
      font-size:1.4rem;
      font-weight:bold;
      box-shadow:0 0 30px rgba(255,255,255,0.4);
    }

    .range-container{
      width:90%;
      max-width:700px;
      margin-top:40px;
    }

    input[type="range"]{
      width:100%;
      appearance:none;
      height:4px;
      background:rgba(255,255,255,0.2);
      border-radius:10px;
      outline:none;
    }

    input[type="range"]::-webkit-slider-thumb{
      appearance:none;
      width:26px;
      height:26px;
      border-radius:50%;
      background:white;
      cursor:pointer;
    }

    .labels{
      display:flex;
      justify-content:space-between;
      margin-top:14px;
      opacity:0.7;
      letter-spacing:2px;
    }

    /* =========================
       RESPONSIVE
    ==========================*/

    @media(max-width:768px){

      .hero-content h1{
        font-size:3rem;
      }

      .viewer-title{
        font-size:2rem;
      }

    }

  </style>
</head>
<body>

<!-- =====================================
     HERO VIDEO
====================================== -->

<section class="hero">

  <!-- CAMBIAR VIDEO -->
  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="hero-content">

    <h1>PANADERÍA</h1>

    <p>
      Arquitectura con identidad urbana.
      Explorá el proyecto con diferente iluminación.
    </p>

    <button class="scroll-btn" onclick="scrollToViewer()">
      EXPLORAR PROYECTO
    </button>

  </div>

</section>

<!-- =====================================
     VISOR DIA/NOCHE
====================================== -->

<section class="viewer-section" id="viewer">

  <h2 class="viewer-title">
    VISOR INTERACTIVO
  </h2>

  <p class="viewer-subtitle">
    Deslizá para cambiar entre visualización diurna y nocturna
  </p>

  <div class="viewer-container">

    <!-- IMAGEN NOCHE -->
    <img
      src="noche.png"
      class="image-night"
      alt=""
    >

    <!-- IMAGEN DIA -->
    <div class="image-day-wrapper" id="dayWrapper">

      <img
        src="dia.png"
        class="image-day"
        alt=""
      >

    </div>

    <!-- LINEA -->
    <div class="slider-line" id="sliderLine"></div>

    <!-- BOTON -->
    <div class="slider-button" id="sliderButton">
      ↔
    </div>

  </div>

  <!-- RANGE -->
  <div class="range-container">

    <input
      type="range"
      min="0"
      max="100"
      value="50"
      id="slider"
    >

    <div class="labels">
      <span>DÍA</span>
      <span>NOCHE</span>
    </div>

  </div>

</section>

<script>

  const slider = document.getElementById("slider");
  const dayWrapper = document.getElementById("dayWrapper");
  const sliderLine = document.getElementById("sliderLine");
  const sliderButton = document.getElementById("sliderButton");

  slider.addEventListener("input", () => {

    const value = slider.value;

    dayWrapper.style.width = value + "%";

    sliderLine.style.left = value + "%";

    sliderButton.style.left = value + "%";

  });

  function scrollToViewer(){

    document.getElementById("viewer").scrollIntoView({
      behavior:"smooth"
    });

  }

</script>

</body>
</html>
